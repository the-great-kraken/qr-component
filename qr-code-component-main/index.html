<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');
    
    body { background-color: hsl(212, 45%, 89%); display: flex; justify-content: center; align-items: center; min-height: 100vh;}

    .card { 
      font-family: "Outfit", 
      sans-serif; text-align: 
      center; border-radius: 20px; 
      background-color: hsl(0, 0%, 100%); 
      box-sizing: border-box; width: 320px; 
      padding: 20px 20px 20px 20px; 
      box-shadow: 0px 25px 25px rgb(0 0 0 / 4.77%);
    }
    .card h3 { color: hsl(218, 44%, 22%); font-size: 22px; font-weight: 700; line-height: 120%; letter-spacing: 0px; }
    .card p { color: hsl(216, 15%, 48%); font-size: 15px; font-weight: 400; line-height: 140%; letter-spacing: 0.2px; }
    .card img { border-radius: 10px; margin: 0px;}

  </style>
</head>
<body>
  <div class="card"> 
    <img src="images/image-qr-code.png" width="100%">
    <h3>Improve your front-end skills by building projects</h3>
    <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
</body>
</html>
